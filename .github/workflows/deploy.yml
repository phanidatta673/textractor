name: Monolith Infrastructure & Deployment

on:
  push:
    branches: [ main, feature/text-extraction-improvements ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (apply/destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  deploy-monolith:
    name: Deploy Monolith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init & Apply/Destroy
        id: terraform
        working-directory: ./terraform
        env:
          TF_VAR_github_token: ${{ secrets.GH_PAT }}
          TF_VAR_sprites_token: ${{ secrets.SPRITES_TOKEN }}
          TF_VAR_github_owner: "phanidatta673"
          TF_VAR_github_repo: "textractor"
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          TF_VAR_secret_code: ${{ secrets.SECRET_CODE }}
        run: |
          terraform init
          if [[ "${{ github.event.inputs.action }}" == "destroy" ]]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve
            # Get EC2 Public IP from Terraform output
            PUBLIC_IP=$(terraform output -raw ec2_public_ip)
            echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
          fi

      - name: Deployment Info
        if: github.event.inputs.action != 'destroy'
        run: |
          echo "Monolith Infrastructure deployed successfully."
          echo "The app is now live at: http://${{ env.PUBLIC_IP }}"
          echo "API endpoints are available at: http://${{ env.PUBLIC_IP }}/api/..."
          echo "Web UI is available at: http://${{ env.PUBLIC_IP }}/html"
