name: Dockerized Deploy & Infrastructure

on:
  push:
    branches: [ main, feature/text-extraction-improvements ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (apply/destroy)'
        required: true
        default: 'apply'
        type: choice
        options:
        - apply
        - destroy

jobs:
  terraform-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Backend Lambdas
        if: github.event.inputs.action != 'destroy'
        working-directory: ./backend
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify Dist Folders
        if: github.event.inputs.action != 'destroy'
        run: |
          echo "Listing all dist directories to confirm existence:"
          find backend/lambdas -name "dist" -type d
          ls -R backend/lambdas/*/dist

      - name: Terraform Init & Apply/Destroy
        id: terraform
        working-directory: ./terraform
        env:
          TF_VAR_github_token: ${{ secrets.GH_PAT }}
          TF_VAR_sprites_token: ${{ secrets.SPRITES_TOKEN }}
          TF_VAR_github_owner: "phanidatta673"
          TF_VAR_github_repo: "textractor"
          TF_VAR_region: ${{ secrets.AWS_REGION }}
        run: |
          terraform init
          if [[ "${{ github.event.inputs.action }}" == "destroy" ]]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve
            echo "API_URL=$(terraform output -raw api_url)" >> $GITHUB_ENV
            echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_ENV
            echo "UPLOADS_BUCKET=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
          fi

      - name: Build and Deploy Frontend to S3
        if: github.event.inputs.action != 'destroy'
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_BUCKET_NAME: ${{ env.UPLOADS_BUCKET }}
        run: |
          npm install
          # Next.js static export
          npm run build
          # Sync the 'out' directory to S3
          aws s3 sync out/ s3://${{ env.FRONTEND_BUCKET }} --delete

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push Frontend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: textractor-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest

      - name: Update Lambdas
        run: |
          echo "Infrastructure deployed and images pushed to ECR."
          echo "The app is now live at the API Gateway endpoint provided by Terraform outputs."
