<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Extractor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .drag-over { border-color: #4f46e5; background-color: #f5f3ff; }
        .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-processing { background-color: #dbeafe; color: #1e40af; }
        .status-completed { background-color: #d1fae5; color: #065f46; }
        .status-failed { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="h-full">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-white border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center">
                        <i class="fas fa-file-invoice text-indigo-600 text-2xl mr-3"></i>
                        <h1 class="text-xl font-bold text-gray-900">Text Extractor</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <input type="password" id="secretCode" 
                                placeholder="Enter Secret Code"
                                class="block w-64 rounded-md border-0 py-1.5 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
                            >
                            <button id="toggleSecret" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="py-10">
            <div class="max-w-7xl mx-auto sm:px-6 lg:px-8">
                <!-- Upload Area -->
                <div class="px-4 py-8 sm:px-0">
                    <div id="dropZone" class="relative block w-full rounded-lg border-2 border-dashed border-gray-300 p-12 text-center hover:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200 cursor-pointer">
                        <i class="fas fa-cloud-upload-alt text-gray-400 text-5xl mb-4"></i>
                        <span class="mt-2 block text-sm font-semibold text-gray-900">
                            Drag & drop files here, or <span class="text-indigo-600">browse</span>
                        </span>
                        <span class="mt-1 block text-xs text-gray-500">
                            PDF, DOCX, TXT, or ZIP (Max 10MB)
                        </span>
                        <input type="file" id="fileInput" class="hidden" multiple accept=".pdf,.docx,.txt,.zip">
                    </div>

                    <!-- Selected Files Queue -->
                    <div id="fileQueue" class="mt-4 hidden">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-sm font-medium text-gray-700">Queue</h3>
                            <button id="submitBtn" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                                Extract Now
                            </button>
                        </div>
                        <ul id="queueList" class="bg-white rounded-md border border-gray-200 divide-y divide-gray-200">
                            <!-- Queue items -->
                        </ul>
                    </div>
                </div>

                <!-- Active Uploads / Status -->
                <div class="mt-8 px-4 sm:px-0">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-medium text-gray-900">Recent Extractions</h2>
                        <button id="clearHistory" class="text-sm text-gray-500 hover:text-indigo-600">Clear History</button>
                    </div>
                    
                    <div id="statusList" class="bg-white shadow overflow-hidden sm:rounded-md divide-y divide-gray-200">
                        <!-- Empty state -->
                        <div id="emptyState" class="px-4 py-12 text-center text-gray-500">
                            <i class="fas fa-history text-3xl mb-2 block opacity-20"></i>
                            <p>No extractions yet. Upload a file to get started.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Extraction Result Modal -->
    <div id="modal" class="fixed z-10 inset-0 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Extracted Text</h3>
                            <div class="mt-4 bg-gray-50 rounded-lg p-4 max-h-[60vh] overflow-y-auto">
                                <pre id="modalContent" class="text-sm text-gray-700 whitespace-pre-wrap font-mono"></pre>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="copyText" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Copy Text
                    </button>
                    <button type="button" id="closeModal" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const secretCodeInput = document.getElementById('secretCode');
        const toggleSecret = document.getElementById('toggleSecret');
        const statusList = document.getElementById('statusList');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modalContent');
        const closeModal = document.getElementById('closeModal');
        const copyText = document.getElementById('copyText');
        const clearHistory = document.getElementById('clearHistory');
        const fileQueue = document.getElementById('fileQueue');
        const queueList = document.getElementById('queueList');
        const submitBtn = document.getElementById('submitBtn');

        let extractions = JSON.parse(localStorage.getItem('extractions') || '[]');
        let filesToUpload = [];
        
        // Initialize
        secretCodeInput.value = localStorage.getItem('secretCode') || '';
        renderExtractions();
        
        // Polling loop for active extractions
        setInterval(pollActiveExtractions, 2000);

        // --- Event Listeners ---

        secretCodeInput.addEventListener('input', (e) => {
            localStorage.setItem('secretCode', e.target.value);
        });

        toggleSecret.addEventListener('click', () => {
            const isPassword = secretCodeInput.type === 'password';
            secretCodeInput.type = isPassword ? 'text' : 'password';
            toggleSecret.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        submitBtn.addEventListener('click', submitAll);

        closeModal.addEventListener('click', () => modal.classList.add('hidden'));
        
        copyText.addEventListener('click', () => {
            navigator.clipboard.writeText(modalContent.textContent);
            copyText.textContent = 'Copied!';
            setTimeout(() => copyText.textContent = 'Copy Text', 2000);
        });

        clearHistory.addEventListener('click', () => {
            extractions = [];
            saveExtractions();
            renderExtractions();
        });

        // --- Core Functions ---

        function handleFiles(files) {
            for (const file of files) {
                filesToUpload.push(file);
            }
            renderQueue();
        }

        function renderQueue() {
            if (filesToUpload.length === 0) {
                fileQueue.classList.add('hidden');
                return;
            }

            fileQueue.classList.remove('hidden');
            queueList.innerHTML = filesToUpload.map((file, index) => `
                <li class="px-4 py-2 flex items-center justify-between">
                    <div class="flex items-center">
                        <i class="${getFileIcon(file.name)} text-gray-400 mr-2"></i>
                        <span class="text-sm text-gray-700">${file.name}</span>
                    </div>
                    <button onclick="removeFromQueue(${index})" class="text-gray-400 hover:text-red-500">
                        <i class="fas fa-times"></i>
                    </button>
                </li>
            `).join('');
        }

        window.removeFromQueue = function(index) {
            filesToUpload.splice(index, 1);
            renderQueue();
        };

        async function submitAll() {
            const secret = secretCodeInput.value;
            if (!secret) {
                alert('Please enter a secret code first.');
                return;
            }

            if (filesToUpload.length === 0) return;

            const files = [...filesToUpload];
            filesToUpload = [];
            renderQueue();

            for (const file of files) {
                const extraction = {
                    id: Math.random().toString(36).substr(2, 9),
                    filename: file.name,
                    status: 'PENDING',
                    timestamp: new Date().toISOString()
                };
                
                extractions.unshift(extraction);
                saveExtractions();
                renderExtractions();
                
                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const res = await fetch('/api/process', {
                        method: 'POST',
                        headers: { 
                            'X-Secret-Code': secret 
                        },
                        body: formData
                    });
                    
                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();
                    
                    extraction.fileId = data.fileId;
                } catch (err) {
                    console.error(err);
                    extraction.status = 'FAILED';
                    extraction.error = err.message;
                }
                
                saveExtractions();
                renderExtractions();
            }
        }

        async function pollActiveExtractions() {
            const active = extractions.filter(e => ['PENDING', 'PROCESSING'].includes(e.status) && e.fileId);
            if (active.length === 0) return;

            for (const extraction of active) {
                try {
                    const res = await fetch(`/api/status/${extraction.fileId}`);
                    if (!res.ok) continue;
                    
                    const data = await res.json();
                    if (data.status !== extraction.status || data.content) {
                        extraction.status = data.status;
                        if (data.content) extraction.content = data.content;
                        if (data.error) extraction.error = data.error;
                        
                        saveExtractions();
                        renderExtractions();
                    }
                } catch (err) {
                    console.error('Polling error:', err);
                }
            }
        }

        function saveExtractions() {
            localStorage.setItem('extractions', JSON.stringify(extractions));
        }

        function renderExtractions() {
            if (extractions.length === 0) {
                emptyState.classList.remove('hidden');
                statusList.innerHTML = '';
                statusList.appendChild(emptyState);
                return;
            }

            emptyState.classList.add('hidden');
            statusList.innerHTML = extractions.map(e => `
                <div class="px-4 py-4 sm:px-6 hover:bg-gray-50 transition-colors">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center min-w-0">
                            <i class="${getFileIcon(e.filename)} text-gray-400 mr-3 text-lg"></i>
                            <div class="truncate">
                                <p class="text-sm font-medium text-indigo-600 truncate">${e.filename}</p>
                                <p class="text-xs text-gray-500">${new Date(e.timestamp).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="ml-2 flex-shrink-0 flex items-center space-x-2">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full status-${e.status.toLowerCase()}">
                                ${e.status}
                            </span>
                            ${e.status === 'COMPLETED' ? `
                                <button onclick="viewResult('${e.id}')" class="text-indigo-600 hover:text-indigo-900 text-sm font-medium">
                                    View
                                </button>
                            ` : ''}
                        </div>
                    </div>
                    ${e.error ? `<p class="mt-2 text-xs text-red-500 italic">Error: ${e.error}</p>` : ''}
                </div>
            `).join('');
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch(ext) {
                case 'pdf': return 'far fa-file-pdf';
                case 'docx': return 'far fa-file-word';
                case 'txt': return 'far fa-file-alt';
                case 'zip': return 'far fa-file-archive';
                default: return 'far fa-file';
            }
        }

        window.viewResult = function(id) {
            const extraction = extractions.find(e => e.id === id);
            if (extraction && extraction.content) {
                modalContent.textContent = extraction.content;
                modal.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
